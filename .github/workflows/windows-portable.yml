
name: DeepLiveCam Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools Cython
          python -m pip install -r requirements.txt
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install onnxruntime==1.28.0 requests pyinstaller
          python -m pip check

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-win

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m PyInstaller --noconfirm --clean --onedir --console --name DeepLiveCam --paths . --collect-all insightface --collect-all onnxruntime --collect-all opennsfw2 --collect-submodules modules.processors.frame --hidden-import pygrabber.dshow_graph --add-data "models;models" --add-data "locales;locales" --add-data "media;media" run.py

          $bin = "dist/DeepLiveCam/_internal"

          $ffmpeg = Get-ChildItem ffmpeg-win -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-win -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (!$ffmpeg -or !$ffprobe) {
            throw "FFmpeg binaries not found"
          }

          Copy-Item $ffmpeg.FullName "$bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$bin/ffprobe.exe"
          Copy-Item LICENSE "dist/DeepLiveCam/LICENSE"

          Set-Content "dist/DeepLiveCam/README-WINDOWS.txt" -Value "Extract the entire folder. Run DeepLiveCam.exe. Internet access is required on first launch to download AI models. Source: https://github.com/xuq873031-lang/Deep-Live-Cam"

          & ".\dist\DeepLiveCam\DeepLiveCam.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "EXE smoke test failed"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DeepLiveCam-Windows-x64
          path: dist/DeepLiveCam/
          if-no-files-found: error
          retention-days: 7
